name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: echo "APP_VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build MouseTrail/MouseTrail.csproj -c Release

      - name: Publish (win-x64, self-contained, single file)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish MouseTrail/MouseTrail.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$env:APP_VERSION" -o publish

      - name: Publish (win-x64, framework-dependent, single file)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish MouseTrail/MouseTrail.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true "-p:Version=$env:APP_VERSION" -o publish-fd

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/MouseTrail.exe -DestinationPath MouseTrail-${{ github.ref_name }}-win-x64.zip
          Compress-Archive -Path publish-fd/MouseTrail.exe -DestinationPath MouseTrail-${{ github.ref_name }}-win-x64-framework-dependent.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseTrail-${{ github.ref_name }}-win-x64.zip
            MouseTrail-${{ github.ref_name }}-win-x64-framework-dependent.zip
          generate_release_notes: true
